[workspace]
members = [
    "crates/hetzner",
    "crates/cloud",
    # R859-F2 (2026-09-08, operator decision): the floating-IP seam + the pure
    # ingress-failover planner, carved out of `cloud` so `yubaba` can drive
    # failover without a runtime yubaba -> cloud edge. Same move R374-F3 made
    # for local-driver; see the crate's own header for why the dep list stays
    # at two.
    "crates/floating-ip",
    # R859-F3 (2026-09-08): the Hetzner/OVH/Vultr HTTP adapters, carved out of
    # `cloud` in turn so the fleet daemon can MOVE a floating IP and not merely
    # decide to. Sits between the two: above `floating-ip` (whose dep list is
    # capped at two), below `cloud` (whose envoy layer and `fob` lookup must not
    # ship to a node).
    "crates/floating-ip-adapters",
    # R732-T4 (W245/W253): the per-node WAL→R2 streamer. A data-plane service,
    # deliberately not part of the yubaba server crate — see its crate doc.
    "crates/tenant-streamer",
    "crates/yubaba",
    # noisetable R118-T11 (W138/A111): the raft core — state machine, log store, HTTP
    # network factory, ClusterPolicy and the membership ratchet — carved out of
    # the fleet daemon so a gallery plinth links consensus without pond,
    # litestream, ACME, cheers or containerd. `yubaba` is now a consumer; see
    # the crate's own header for what stayed behind and why.
    "crates/yubaba-consensus",
    "crates/yubaba-client",
    "crates/yubaba-test-harness",
    "crates/yubaba-test-macros",
]
resolver = "2"

[workspace.package]
version = "0.8.40"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/yubaba"

# Cross-workspace deps yubaba/cloud pulls from the sibling oss repos during
# local development. Redirects the version-based deps to their local paths for
# atomic monorepo dev; stripped on export (scripts/export-oss.sh) so the
# standalone mirror resolves yah-base/kamaji/qed crates from crates.io.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
# W308/R745-T1: `-C incremental` makes sccache refuse a crate outright. This
# glob applies to DEPENDENCIES and never to workspace members, so crates you
# edit here keep incremental and crates you merely consume become cacheable.
incremental = false
