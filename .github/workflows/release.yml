        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/yah-ai/rusty-v8-musl-builder:latest" \
            -t "ghcr.io/yah-ai/rusty-v8-musl-builder:${TAG}" \
            "ghcr.io/yah-ai/rusty-v8-musl-builder@${DIGEST}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign rusty-v8-musl-builder (keyless OIDC)
        env:
          DIGEST: ${{ needs.image-rusty-v8-musl-builder.outputs.digest }}
        run: cosign sign --yes "ghcr.io/yah-ai/rusty-v8-musl-builder@${DIGEST}"

  publish-image-yubaba:
    name: image / yah-yubaba (publish)
