        run: cosign sign --yes "ghcr.io/yah-ai/yah-miniflare@${DIGEST}"

  # ---------------------------------------------------------------------------
  # publish-cli (R638-F1) — sign-blob + R2 cp + GH Release + fragment emit.
  #
  # Was GH-Release-upload only, which is why `curl yah.dev/install.sh | sh -s --
  # yah` 404'd: install.sh resolves cdn.yah.dev/<pkg>/latest.json and nothing
  # ever wrote yah/latest.json. Same three-part shape as publish-mesofact /
  # publish-yubaba, and deliberately the SAME R2 layout as R587-T1's desktop
  # publish (`<name>/<version>/<triple>/` immutable bytes + one mutable
  # latest.json pointer) — install.sh is generic over <pkg> precisely so this
  # needed no installer changes beyond the default package.
  #
  # NOTE the on-disk artifact is `cli-<tag>-<triple>.tar.gz` (the historical
  # name, kept so the GH Release asset names don't churn) while the R2 object
  # is `yah-<triple>.tar.gz` under the `yah/` prefix. install.sh takes the
  # filename from the manifest url, and untars with --strip-components=1, so
  # the stage dir inside (`cli-<tag>-<triple>/`) is irrelevant to it.
  # ---------------------------------------------------------------------------
  publish-cli:
    name: cli / ${{ matrix.target }} (publish)
    needs: [smoke, cli-build]
    if: |
      always()
      && needs.smoke.result != 'failure'
      && needs.smoke.result != 'cancelled'
      && needs.cli-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Download cli tarball
        uses: actions/download-artifact@v4
        with:
          name: cli-tarball-${{ matrix.target }}
          path: .

      - uses: sigstore/cosign-installer@v3

      - name: Sign tarball (cosign sign-blob, keyless OIDC)
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.cert" \
            "${TARBALL}"
          ls -la "${TARBALL}" "${TARBALL}.sig" "${TARBALL}.cert"

      - name: Publish tarball + signatures to R2 (yah-dev / cdn.yah.dev)
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          TRIPLE="${{ matrix.target }}"
          SRC="cli-${REF}-${TRIPLE}.tar.gz"
          KEY_PREFIX="yah/${VERSION}/${TRIPLE}"
          DEST_NAME="yah-${TRIPLE}.tar.gz"
          ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${SRC}"      "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}"      --endpoint-url "${ENDPOINT}"
          aws s3 cp "${SRC}.sig"  "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}.sig"  --endpoint-url "${ENDPOINT}"
          aws s3 cp "${SRC}.cert" "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}.cert" --endpoint-url "${ENDPOINT}"

      # ── WHY EVERY PUBLISH LEG COMPUTES TWO HASHES (R330-F40) ─────────────────
      #
      # Read this before "simplifying" it down to one. Its absence here is the
      # root cause of the whole R330-F40 thread: nothing in this file ever said
      # why sha256 was chosen, so the answer had to be reconstructed downstream
      # by the consumer that got bitten by it.
      #
      # POLICY: BLAKE3 is THE yah asset hash. One algorithm across the whole
      # ecosystem — xlb, the blob store, kg ids, the desktop updater's
      # `blake3:<hex>` blob refs, the x-amz-meta-blake3 asset stamps. If you are
      # asking "which hash identifies this artifact", the answer is blake3, and
      # `hash` below is where it lives.
      #
      # SHA-256 IS NOT A SECOND IDENTITY. It is a bootstrap-verification aid for
      # exactly one consumer: `curl yah.dev/install.sh | sh`. A bare POSIX box
      # has three ways to check sha256 (sha256sum / shasum -a 256 / openssl dgst)
      # and zero to check blake3 — so verifying blake3 there would mean first
      # downloading an unverified b3sum to verify with, which is circular and
      # strictly worse. That is the ONE place the one-algorithm policy cannot
      # reach, and `bootstrap_hash` is scoped to it by its own name.
      #
      # BOTH ARE TAGGED (`blake3:…` / `sha256:…`) so no consumer ever infers an
      # algorithm from a field name. Bare hex is what produces a pile of digests
      # nobody can tell apart when one of them is computed wrong.
      #
      # The bare `sha256` key is DEPRECATED and kept only because every
      # `install.sh` already in the wild reads `.triples[$t].sha256`. Delete it
      # once those age out — and delete "sha256" from LEGACY_BARE_HEX_PATHS in
      # oss/yubaba/crates/almanac/src/feed.rs at the same time, which is what
      # arms the guard test against it coming back.
      #
      # Same fragment shape publish-mesofact emits — a superset of the
      # ReleaseAsset the marketing /releases page renders
      # (app/yah/web/marketing/src/releases.ts). The two musl `platform` keys
      # were added to that page's PLATFORM_LABELS by this ticket; gnu and musl
      # must NOT collapse onto one key, or the page lists two different
      # binaries as the same platform.
      - name: Install b3sum (blake3 is the canonical asset hash)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v b3sum >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq b3sum || cargo install b3sum --locked
          fi
          command -v b3sum >/dev/null 2>&1 || {
            echo "::error::b3sum unavailable — refusing to publish an artifact with no blake3 identity"
            exit 1
          }
          b3sum --version

      - name: Emit per-triple manifest fragment
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          TRIPLE="${{ matrix.target }}"
          SRC="cli-${REF}-${TRIPLE}.tar.gz"
          DEST_NAME="yah-${TRIPLE}.tar.gz"
          URL="https://cdn.yah.dev/yah/${VERSION}/${TRIPLE}/${DEST_NAME}"
          case "${TRIPLE}" in
            aarch64-apple-darwin)       PLATFORM="macos-arm64" ;;
            x86_64-apple-darwin)        PLATFORM="macos-x86_64" ;;
            x86_64-unknown-linux-gnu)   PLATFORM="linux-x86_64" ;;
            x86_64-unknown-linux-musl)  PLATFORM="linux-x86_64-musl" ;;
            aarch64-unknown-linux-musl) PLATFORM="linux-aarch64-musl" ;;
            *) echo "::error::no PLATFORM_LABELS key for ${TRIPLE}" >&2; exit 1 ;;
          esac
          SIZE=$(stat -c%s "${SRC}")
          BLAKE3=$(b3sum --no-names "${SRC}")
          SHA256=$(sha256sum "${SRC}" | awk '{print $1}')
          # A hash that is absent or malformed must stop the publish here. The
          # alternative — shipping the artifact with the key omitted — is what
          # scripts/publish-desktop.sh used to do, and it silently produced
          # public downloads that nobody could verify.
          [[ "${BLAKE3}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::b3sum produced '${BLAKE3}' for ${SRC}"; exit 1; }
          [[ "${SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256sum produced '${SHA256}' for ${SRC}"; exit 1; }
          mkdir -p fragments
          jq -n \
            --arg triple "${TRIPLE}" --arg platform "${PLATFORM}" \
            --arg filename "${DEST_NAME}" --arg url "${URL}" \
            --arg hash "blake3:${BLAKE3}" --arg bootstrap "sha256:${SHA256}" \
            --arg sha256 "${SHA256}" --argjson size "${SIZE}" \
            '{triple: $triple, platform: $platform, filename: $filename,
              url: $url, hash: $hash, bootstrap_hash: $bootstrap,
              sha256: $sha256, size_bytes: $size,
              sig_url: ($url + ".sig"), cert_url: ($url + ".cert"),
              bins: ["yah", "yahh", "yahb", "yaha"]}' \
            > "fragments/${TRIPLE}.json"
          cat "fragments/${TRIPLE}.json"

      - name: Upload manifest fragment as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-manifest-fragment-${{ matrix.target }}
          path: fragments/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sig
            cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.cert
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # cli-release-manifest (R638-F1) — merge per-triple fragments → `yah/latest.json`,
  # the pointer `curl yah.dev/install.sh | sh` resolves with no arguments.
  #
  # Two objects, same split as mesofact-release-manifest / R587-T1: an IMMUTABLE
  # per-version manifest that stays cacheable forever, and one MUTABLE
  # latest.json that just re-points. The pointer flip IS the release.
  # ---------------------------------------------------------------------------
  cli-release-manifest:
    name: cli / release-manifest
    needs: [publish-cli]
    if: |
      needs.publish-cli.result == 'success'
      && (startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          ls -la fragments/
          # Fail rather than publish a partial pointer: install.sh resolves the
          # user's triple out of this map, so a missing leg is a silent
          # "unsupported platform" for everyone on it. Keep this count in sync
          # with publish-cli's matrix.
          shopt -s nullglob
          frags=(fragments/*.json)
          if [ "${#frags[@]}" -ne 5 ]; then
            echo "::error::expected 5 cli triples, got ${#frags[@]}" >&2
            exit 1
          fi
          jq -n --arg name yah --arg v "${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{name: $name, version: $v, pub_date: $pub_date,
              triples: (reduce inputs as $f ({}; .[$f.triple] = ($f | del(.triple))))}' \
            fragments/*.json > latest.json
          cat latest.json

      - name: Publish manifests to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Immutable per-version copy — safe to cache forever.
          aws s3 cp latest.json \
            "s3://yah-dev/yah/${VERSION}/manifest.json" \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
          # The mutable pointer install.sh reads. Written LAST so a failed
          # per-version upload never leaves the pointer aimed at nothing.
          aws s3 cp latest.json \
            s3://yah-dev/yah/latest.json \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0"

  # ---------------------------------------------------------------------------
  # publish-yubaba — sign-blob + R2 cp + GH Release upload + manifest fragment.
  #
  # Downloads yubaba-build's tarball artifacts, signs with cosign sign-blob
  # (keyless OIDC), uploads tarball + .sig + .cert to R2 (canonical path per
  # the retired yubaba-release wrapper), uploads to GH Release (back-compat),
  # emits per-triple manifest
  # fragment as a workflow artifact for yubaba-release-manifest.
  # ---------------------------------------------------------------------------
  publish-yubaba:
    name: yubaba / ${{ matrix.target }} (publish)
    needs: [smoke, yubaba-build]
    if: |
      always()
      && needs.smoke.result != 'failure'
      && needs.smoke.result != 'cancelled'
      && needs.yubaba-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Download yubaba tarball
        uses: actions/download-artifact@v4
        with:
          name: yubaba-tarball-${{ matrix.target }}
          path: .

      - uses: sigstore/cosign-installer@v3

      - name: Sign tarball (cosign sign-blob, keyless OIDC)
        shell: bash
        run: |
          TARBALL="yubaba-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.cert" \
            "${TARBALL}"
          ls -la "${TARBALL}" "${TARBALL}.sig" "${TARBALL}.cert"

      # Canonical R2 layout, inherited from the retired yubaba-release wrapper
      # (now folded into .yah/qed/release.toml):
      #   yubaba/<version>/<triple>/yah-yubaba-<triple>.tar.gz
      # served at https://cdn.yah.dev/yubaba/...
      - name: Publish tarball + signatures to R2 (yah-dev / cdn.yah.dev)
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          TRIPLE="${{ matrix.target }}"
          SRC="yubaba-${REF}-${TRIPLE}.tar.gz"
          KEY_PREFIX="yubaba/${VERSION}/${TRIPLE}"
          DEST_NAME="yubaba-${TRIPLE}.tar.gz"
          ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${SRC}"        "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}"        --endpoint-url "${ENDPOINT}"
          aws s3 cp "${SRC}.sig"    "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}.sig"    --endpoint-url "${ENDPOINT}"
          aws s3 cp "${SRC}.cert"   "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}.cert"   --endpoint-url "${ENDPOINT}"

      # `hash` (blake3, identity) + `bootstrap_hash` (sha256, curl|sh aid) +
      # the deprecated bare `sha256`: see the long rationale block on
      # publish-cli's fragment step above. Do not drop one without reading it.
      - name: Install b3sum (blake3 is the canonical asset hash)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v b3sum >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq b3sum || cargo install b3sum --locked
          fi
          command -v b3sum >/dev/null 2>&1 || {
            echo "::error::b3sum unavailable — refusing to publish an artifact with no blake3 identity"
            exit 1
          }
          b3sum --version

      - name: Emit per-triple manifest fragment
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          TRIPLE="${{ matrix.target }}"
          SRC="yubaba-${REF}-${TRIPLE}.tar.gz"
          BASE_URL="https://cdn.yah.dev/yubaba/${VERSION}/${TRIPLE}/yubaba-${TRIPLE}.tar.gz"
          SIZE=$(stat -c%s "${SRC}")
          BLAKE3=$(b3sum --no-names "${SRC}")
          SHA256=$(sha256sum "${SRC}" | awk '{print $1}')
          [[ "${BLAKE3}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::b3sum produced '${BLAKE3}' for ${SRC}"; exit 1; }
          [[ "${SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256sum produced '${SHA256}' for ${SRC}"; exit 1; }
          mkdir -p fragments
          cat > "fragments/${TRIPLE}.json" <<EOF
          {
            "triple": "${TRIPLE}",
            "url": "${BASE_URL}",
            "size": ${SIZE},
            "hash": "blake3:${BLAKE3}",
            "bootstrap_hash": "sha256:${SHA256}",
            "sha256": "${SHA256}",
            "sig_url": "${BASE_URL}.sig",
            "cert_url": "${BASE_URL}.cert"
          }
          EOF
          cat "fragments/${TRIPLE}.json"

      - name: Upload manifest fragment as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yubaba-manifest-fragment-${{ matrix.target }}
          path: fragments/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

      # Back-compat: keep uploading to GitHub Releases during transition to R2
      # canon. Drop once consumers (cloud-init, deploy-remote.sh) are entirely
      # off the gh-release URL shape.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            yubaba-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            yubaba-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sig
            yubaba-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.cert
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # publish-camp — download camp-build's tarballs, upload to GH Release.
  # ---------------------------------------------------------------------------
  publish-camp:
    name: camp / ${{ matrix.target }} (publish)
    needs: [smoke, camp-build]
    if: |
      always()
      && needs.smoke.result != 'failure'
      && needs.smoke.result != 'cancelled'
      && needs.camp-build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Download camp tarball
        uses: actions/download-artifact@v4
        with:
          name: camp-tarball-${{ matrix.target }}
          path: .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: camp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # yubaba-release-manifest — merge per-triple fragments + publish to R2.
  # ---------------------------------------------------------------------------
  yubaba-release-manifest:
    name: yubaba / release-manifest
    needs: [publish-yubaba]
    if: |
      needs.publish-yubaba.result == 'success'
      && (startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checked out for cluster-epochs.json — the epochs are declared in-tree,
      # not carried by the build artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: yubaba-manifest-fragment-*
          path: fragments
          merge-multiple: true

      # R625-F2 / W275: cluster_protocol (wire) + state_epoch (on-disk) are
      # release-wide, not per-triple, so they are merged in here rather than in
      # the per-triple fragments. They come from the SAME file the yubaba binary
      # parses at compile time (src/cluster_epoch.rs `include_str!`s it), so the
      # published manifest cannot drift from what the deployed node reports on
      # /health. Missing or non-integer values fail this job rather than
      # publishing a manifest that silently declares nothing.
      - name: Build release-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          EPOCHS="oss/yubaba/crates/yubaba/cluster-epochs.json"
          test -f "${EPOCHS}" || { echo "missing ${EPOCHS}" >&2; exit 1; }
          CLUSTER_PROTOCOL=$(jq -e '.cluster_protocol | numbers' "${EPOCHS}")
          STATE_EPOCH=$(jq -e '.state_epoch | numbers' "${EPOCHS}")
          ls -la fragments/
          jq -n --arg v "${VERSION}" \
            --argjson cp "${CLUSTER_PROTOCOL}" \
            --argjson se "${STATE_EPOCH}" \
            '{version: $v, cluster_protocol: $cp, state_epoch: $se,
              triples: (reduce inputs as $f ({}; .[$f.triple] = ($f | del(.triple))))}' \
            fragments/*.json > release-manifest.json
          cat release-manifest.json

      - name: Publish release-manifest.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp release-manifest.json \
            s3://yah-dev/yubaba/release-manifest.json \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0"

  # ---------------------------------------------------------------------------
  # publish-mesofact (R560-F1) — sign-blob + R2 cp + GH Release + fragment emit.
  #
  # Same three-part shape as publish-yubaba, and deliberately the SAME R2 layout
  # as R587-T1's desktop publish (`<name>/<version>/<triple>/` immutable bytes +
  # one mutable `latest.json` pointer) rather than a second parallel layout —
  # `install.sh` resolves any package through that one convention.
  # ---------------------------------------------------------------------------
  publish-mesofact:
    name: mesofact / ${{ matrix.target }} (publish)
    needs: [smoke, mesofact-build]
    if: |
      always()
      && needs.smoke.result != 'failure'
      && needs.smoke.result != 'cancelled'
      && needs.mesofact-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Download mesofact tarball
        uses: actions/download-artifact@v4
        with:
          name: mesofact-tarball-${{ matrix.target }}
          path: .

      - uses: sigstore/cosign-installer@v3

      - name: Sign tarball (cosign sign-blob, keyless OIDC)
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="mesofact-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.cert" \
            "${TARBALL}"
          ls -la "${TARBALL}" "${TARBALL}.sig" "${TARBALL}.cert"

      - name: Publish tarball + signatures to R2 (yah-dev / cdn.yah.dev)
        if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          TRIPLE="${{ matrix.target }}"
          SRC="mesofact-${REF}-${TRIPLE}.tar.gz"
          KEY_PREFIX="mesofact/${VERSION}/${TRIPLE}"
          DEST_NAME="mesofact-${TRIPLE}.tar.gz"
          ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${SRC}"      "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}"      --endpoint-url "${ENDPOINT}"
          aws s3 cp "${SRC}.sig"  "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}.sig"  --endpoint-url "${ENDPOINT}"
          aws s3 cp "${SRC}.cert" "s3://yah-dev/${KEY_PREFIX}/${DEST_NAME}.cert" --endpoint-url "${ENDPOINT}"

      # The fragment is a superset of the ReleaseAsset shape the marketing
      # /releases page already renders (platform / filename / url / hash /
      # size_bytes — app/yah/web/marketing/src/releases.ts), so R330's feed
      # producer can map a triple straight onto an asset with no reshaping.
      # `platform` uses that page's PLATFORM_LABELS keys, which cover exactly
      # these four triples.
      #
      # `hash` (blake3, identity) + `bootstrap_hash` (sha256, curl|sh aid) +
      # the deprecated bare `sha256`: see the long rationale block on
      # publish-cli's fragment step above. Do not drop one without reading it.
      - name: Install b3sum (blake3 is the canonical asset hash)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v b3sum >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq b3sum || cargo install b3sum --locked
          fi
          command -v b3sum >/dev/null 2>&1 || {
            echo "::error::b3sum unavailable — refusing to publish an artifact with no blake3 identity"
            exit 1
          }
          b3sum --version

      - name: Emit per-triple manifest fragment
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          TRIPLE="${{ matrix.target }}"
          SRC="mesofact-${REF}-${TRIPLE}.tar.gz"
          DEST_NAME="mesofact-${TRIPLE}.tar.gz"
          URL="https://cdn.yah.dev/mesofact/${VERSION}/${TRIPLE}/${DEST_NAME}"
          case "${TRIPLE}" in
            aarch64-apple-darwin)       PLATFORM="macos-arm64" ;;
            x86_64-apple-darwin)        PLATFORM="macos-x86_64" ;;
            x86_64-unknown-linux-gnu)   PLATFORM="linux-x86_64" ;;
            aarch64-unknown-linux-gnu)  PLATFORM="linux-aarch64" ;;
            *) echo "::error::no PLATFORM_LABELS key for ${TRIPLE}" >&2; exit 1 ;;
          esac
          SIZE=$(stat -c%s "${SRC}")
          BLAKE3=$(b3sum --no-names "${SRC}")
          SHA256=$(sha256sum "${SRC}" | awk '{print $1}')
          [[ "${BLAKE3}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::b3sum produced '${BLAKE3}' for ${SRC}"; exit 1; }
          [[ "${SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256sum produced '${SHA256}' for ${SRC}"; exit 1; }
          mkdir -p fragments
          jq -n \
            --arg triple "${TRIPLE}" --arg platform "${PLATFORM}" \
            --arg filename "${DEST_NAME}" --arg url "${URL}" \
            --arg hash "blake3:${BLAKE3}" --arg bootstrap "sha256:${SHA256}" \
            --arg sha256 "${SHA256}" --argjson size "${SIZE}" \
            '{triple: $triple, platform: $platform, filename: $filename,
              url: $url, hash: $hash, bootstrap_hash: $bootstrap,
              sha256: $sha256, size_bytes: $size,
              sig_url: ($url + ".sig"), cert_url: ($url + ".cert"),
              bins: ["mesofact", "mesofact-dev"]}' \
            > "fragments/${TRIPLE}.json"
          cat "fragments/${TRIPLE}.json"

      - name: Upload manifest fragment as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesofact-manifest-fragment-${{ matrix.target }}
          path: fragments/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            mesofact-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            mesofact-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sig
            mesofact-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.cert
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # mesofact-release-manifest — merge per-triple fragments → the pointer
  # `install.sh` resolves.
  #
  # Two objects, on purpose (same split R587-T1/T2 chose for desktop): an
  # IMMUTABLE per-version manifest that stays cacheable forever, and one MUTABLE
  # `latest.json` at a fixed key that just re-points. That is the whole
  # atomic-release model — the bytes under <version>/ are append-only and the
  # pointer flip is the release.
  # ---------------------------------------------------------------------------
  mesofact-release-manifest:
    name: mesofact / release-manifest
    needs: [publish-mesofact]
    if: |
      needs.publish-mesofact.result == 'success'
      && (startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mesofact-manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          ls -la fragments/
          # Fail rather than publish a partial pointer: install.sh resolves the
          # user's triple out of this map, so a missing leg is a silent
          # "unsupported platform" for everyone on it.
          shopt -s nullglob
          frags=(fragments/*.json)
          if [ "${#frags[@]}" -ne 4 ]; then
            echo "::error::expected 4 mesofact triples, got ${#frags[@]}" >&2
            exit 1
          fi
          jq -n --arg name mesofact --arg v "${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{name: $name, version: $v, pub_date: $pub_date,
              triples: (reduce inputs as $f ({}; .[$f.triple] = ($f | del(.triple))))}' \
            fragments/*.json > latest.json
          cat latest.json

      - name: Publish manifests to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Immutable per-version copy — safe to cache forever.
          aws s3 cp latest.json \
            "s3://yah-dev/mesofact/${VERSION}/manifest.json" \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
          # The mutable pointer install.sh reads. Written LAST so a failed
          # per-version upload never leaves the pointer aimed at nothing.
          aws s3 cp latest.json \
            s3://yah-dev/mesofact/latest.json \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0"

  # ---------------------------------------------------------------------------
  # Desktop bundles + Tauri updater manifest live OUTSIDE GHA.
  #
  # QED's `desktop-release` task signs + bundles the Tauri app locally (or via
  # cloud-rented mac runners) and uploads to the GitHub Release alongside the
  # CLI/yubaba/camp tarballs that this workflow produces. The `latest.json`
  # auto-updater manifest is composed by QED as part of that same task so the
  # signature/url shape stays under one owner.
  #
  # GHA's release scope is: containers + linux CLIs + linux daemons. Adding
  # macOS back would require either GitHub-paid macOS runners (~$0.08/min) or
  # a cheap-mac-rental cloud path we own; the latter is the chosen direction.
  # ---------------------------------------------------------------------------
