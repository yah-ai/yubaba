          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/yah-ai/yah-rust:latest" \
            -t "ghcr.io/yah-ai/yah-rust:${TAG}" \
            "ghcr.io/yah-ai/yah-rust@${DIGEST}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign yah-rust (keyless OIDC)
        env:
          DIGEST: ${{ needs.image-yah-rust.outputs.digest }}
        run: cosign sign --yes "ghcr.io/yah-ai/yah-rust@${DIGEST}"

  publish-image-rust-bun:
    name: image / yah-rust-bun (publish)
    needs: [smoke, image-yah-rust-bun]
    if: |
      always()
      && needs.smoke.result != 'failure'
