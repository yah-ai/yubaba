      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias :smoke-<sha> → :latest + :<tag>
        env:
          DIGEST: ${{ needs.image-yah-rust-bun.outputs.digest }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/yah-ai/yah-rust-bun:latest" \
            -t "ghcr.io/yah-ai/yah-rust-bun:${TAG}" \
            "ghcr.io/yah-ai/yah-rust-bun@${DIGEST}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign yah-rust-bun (keyless OIDC)
        env:
          DIGEST: ${{ needs.image-yah-rust-bun.outputs.digest }}
        run: cosign sign --yes "ghcr.io/yah-ai/yah-rust-bun@${DIGEST}"

  publish-image-rusty-v8-musl-builder:
