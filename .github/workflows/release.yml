#

name: release

# Tag-driven release pipeline (R330-F24 three-layer shape):
#
#   Build layer (no irreversible side-effects)
#     image-yah-*         push only :smoke-<sha> (no sign)
#     cli-build           upload binaries as workflow artifacts
#                         (3 linux + 2 darwin triples — R638-F1)
#     yubaba-build        upload binaries + tarball artifacts
#     camp-build          upload binaries as workflow artifacts
#     mesofact-build      mesofact + mesofact-dev tarball, 4 blessed V8 triples
#
#   Smoke gate (the prepublish quality contract)
#     smoke               downloads cli-build's x86_64-musl tarball, runs
#                         `./yah qed run provider-smoke --param provider=$PROVIDER`
#                         — verifies the exact bytes about to ship
#
#   Publish layer (gated on smoke; all irreversible operations)
#     publish-image-*     imagetools-alias smoke-tag → :latest + :<tag>; cosign sign
#     publish-cli         sign-blob + R2 cp + GH Release upload + fragment emit
#     publish-yubaba      sign-blob + R2 cp + GH Release upload + fragment emit
#     publish-camp        softprops upload to GH Release
#     publish-mesofact    sign-blob + R2 cp + GH Release upload + fragment emit
#     yubaba-release-manifest    merge fragments, R2 publish
#     cli-release-manifest       merge fragments → cdn.yah.dev/yah/latest.json
#                                (what `yah.dev/install.sh | sh` resolves with
#                                 NO arguments — R638-F1)
#     mesofact-release-manifest  merge fragments → cdn.yah.dev/mesofact/latest.json
#                                (`… | sh -s -- mesofact`)
#
# Release jobs (cli + yubaba + camp + desktop) each upload artifacts to one
# GitHub Release keyed on the pushed tag. softprops/action-gh-release@v2 and
# tauri-apps/tauri-action@v0 both create-or-reuse a release by tag_name, so
# concurrent jobs converge on a single release rather than racing to clobber.
#
# Transition plan (yah-qed.md §Relationship to GHA):
#   Phase 2 — qed pipelines run on yubaba for non-release checks; GHA for signing.
#   Phase 3 — cli/yubaba/camp build jobs replaced by `yah qed run release-build`
#             once qed supports cross-compilation target params. Desktop + signing
#             stays in GHA permanently (requires Apple certs + macOS runner).
#
# Spec: .yah/arch/authored/release-pipeline.md
# Ticket: R038-F2 (original), R330-F24 (build/publish split)

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for dry-running the workflow against a hand-picked tag
  # without having to push a real `v*.*.*`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.0.1-test). Must already exist on the repo.'
        required: true
        type: string
      skip_smoke:
        description: 'Skip the live cloud smoke test (use only when a provider is down or smoke is being debugged separately).'
        required: false
        type: boolean
        default: false

# Releases need contents:write to create-or-update the GitHub Release object
# and upload assets. Per-job permissions narrow further — build jobs only get
# packages:write + id-token:write when they actually push to ghcr.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The sparse crates.io index is fetched over HTTP; a single transient blip
  # otherwise fails the request outright. This bit us via `cross`: cross 0.2.5's
  # `cargo metadata` probe loses a race with a cold index, fails, and *silently*
  # falls back to a host `cargo` build — which then dies deep in ring with a
  # cryptic "aarch64-linux-musl-gcc not found" (the musl cross-gcc only exists
  # inside cross's container). Retry the index fetch instead.
  CARGO_NET_RETRY: "10"

jobs:
  # ===========================================================================
  # BUILD LAYER — produce artifacts, no irreversible side-effects.
  #
  # Image build jobs push to ghcr.io/yah-ai/<name>:smoke-<github.sha> only; no
  # canonical :latest or :<tag> push, no cosign sign. Binary build jobs upload
  # tarballs + raw binaries as workflow artifacts. The smoke gate consumes
  # cli-build's artifact; the publish layer consumes everything.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # image-yah-base / image-yah-rust / image-yah-rust-bun (single-arch)
  #
  # FROM chain: rust-bun → rust → base. The base + rust jobs run in parallel,
  # rust-bun waits on rust. Each pushes only :smoke-<sha> — no sign step here.
  # ---------------------------------------------------------------------------
  image-yah-base:
    name: image / yah-base (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push yah-base (:smoke-<sha> only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: oss/qed/crates/qed/images/yah-base
          file: oss/qed/crates/qed/images/yah-base/Dockerfile
          push: true
          tags: ghcr.io/yah-ai/yah-base:smoke-${{ github.sha }}

  image-yah-rust:
    name: image / yah-rust (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push yah-rust (:smoke-<sha> only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: oss/qed/crates/qed/images/yah-rust
          file: oss/qed/crates/qed/images/yah-rust/Dockerfile
          push: true
          tags: ghcr.io/yah-ai/yah-rust:smoke-${{ github.sha }}

  image-yah-rust-bun:
    name: image / yah-rust-bun (build)
    # FROM the rust image built in THIS run: the Dockerfile's RUST_BASE arg
    # (default :latest) is overridden below to :smoke-<sha>, the tag image-yah-rust
    # just pushed. This builds rust-bun against the exact, current rust bytes —
    # no dependency on a prior release's :latest (which doesn't exist on a first
    # or fresh-registry release; that gap caused the v0.8.12 "yah-rust:latest:
    # not found" failure). `needs: [image-yah-rust]` guarantees the smoke tag
    # exists before this job pulls it.
    needs: [image-yah-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push yah-rust-bun (:smoke-<sha> only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: oss/qed/crates/qed/images/yah-rust-bun
          file: oss/qed/crates/qed/images/yah-rust-bun/Dockerfile
          push: true
          tags: ghcr.io/yah-ai/yah-rust-bun:smoke-${{ github.sha }}
          # FROM the rust image built in THIS run (not a prior release's
          # :latest), via the Dockerfile's RUST_BASE arg. Removes the
          # bootstrap dependency on :latest existing beforehand.
          build-args: |
            RUST_BASE=ghcr.io/yah-ai/yah-rust:smoke-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # image-rusty-v8-musl-builder (single-arch, build only) — R546-T1
  #
  # The expensive-leg builder image for the rusty-v8-musl transform recipe
  # (V8 from source → musl static lib; depot_tools + clang + musl cross). Like
  # the base/rust jobs it runs in parallel and pushes only :smoke-<sha>; the
  # publish job aliases + signs. Pinned linux/amd64 (matches the recipe's
  # [placement] platform); the aarch64-musl cross lives inside the image.
  #
  # NOT consumed by default_forge_image() — no digest is threaded into the
  # binary release jobs. The published @sha256 is pasted by an operator into
  # .yah/qed/transforms/rusty-v8-musl.toml's `image =` line (R546-T1 sign-off).
  # ---------------------------------------------------------------------------
  image-rusty-v8-musl-builder:
    name: image / rusty-v8-musl-builder (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push rusty-v8-musl-builder (:smoke-<sha> only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: oss/qed/crates/qed/images/rusty-v8-musl-builder
          file: oss/qed/crates/qed/images/rusty-v8-musl-builder/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yah-ai/rusty-v8-musl-builder:smoke-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # yubaba-build (was yubaba-release)
  #
  # Cross-compiles yah-yubaba + kamaji for the two musl targets. Uploads
  # binaries as workflow artifacts for image-yah-yubaba, plus the cloud-init
  # tarball as a separate artifact for publish-yubaba. No sign-blob, no R2 cp,
  # no GH Release upload — all of that moved to publish-yubaba.
  # ---------------------------------------------------------------------------
  yubaba-build:
    name: yubaba / ${{ matrix.target }} (build)
    needs: [image-yah-base, image-yah-rust, image-yah-rust-bun]
    runs-on: ubuntu-latest
    # Same digest env as cli-build — yubaba bakes the same option_env!
    # constants for default_forge_image() consumers downstream. The smoke-tag
    # digest is the same digest that publish-image-* will alias to :latest /
    # :<tag>, so the baked-in digest stays valid.
    env:
      YAH_BASE_DIGEST: ${{ needs.image-yah-base.outputs.digest }}
      YAH_RUST_DIGEST: ${{ needs.image-yah-rust.outputs.digest }}
      YAH_RUST_BUN_DIGEST: ${{ needs.image-yah-rust-bun.outputs.digest }}
      # Bind-mounted into the cross build container (oss/yubaba/Cross.toml
      # `volumes`) so the ../qed path deps resolve — see that file's comment.
      YAH_REPO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: yubaba-${{ matrix.target }}
          # yubaba lives in oss/yubaba; kamaji now lives in its own oss/kamaji
          # workspace (extracted from yubaba). Cache both target dirs.
          workspaces: |
            oss/yubaba
            oss/kamaji

      - name: Install cross
        run: cargo install cross --locked

      - name: Build yubaba (static musl)
        # yubaba is a member of the oss/yubaba workspace (excluded from the yah
        # root workspace), so build from there — `cross -p yubaba` from the repo
        # root fails with "cannot specify features for packages outside of
        # workspace". oss/yubaba/Cross.toml supplies the protoc pre-build hook.
        # Binary target is `yubaba` (matches the systemd units' /usr/local/bin/yubaba).
        working-directory: oss/yubaba
        # See cli-build: warm the index + hard-fail on cross's silent host fallback.
        # pipefail so cross's exit code isn't swallowed by the `| tee` pipe.
        run: |
          set -o pipefail
          cargo fetch
          cross build --release -p yubaba --locked --features containerd-integration --target ${{ matrix.target }} 2>&1 | tee cross-build.log
          ! grep -qF 'Falling back to' cross-build.log

      - name: Build kamaji (static musl)
        # R406-T13: yubaba + kamaji ship as siblings under one yubaba.slice
        # (W154). kamaji was extracted into its own oss/kamaji workspace, so it
        # is no longer a member of oss/yubaba — build from oss/kamaji. The
        # `kamaji` binary is produced by the `kamaji-bin` crate.
        # oss/kamaji/Cross.toml supplies the protoc pre-build hook + repo-root mount.
        working-directory: oss/kamaji
        # See cli-build: warm the index + hard-fail on cross's silent host fallback.
        # pipefail so cross's exit code isn't swallowed by the `| tee` pipe.
        run: |
          set -o pipefail
          cargo fetch
          cross build --release -p kamaji-bin --locked --features containerd-integration --target ${{ matrix.target }} 2>&1 | tee cross-build.log
          ! grep -qF 'Falling back to' cross-build.log

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="yubaba-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          # yubaba from oss/yubaba/target, kamaji from oss/kamaji/target.
          cp "oss/yubaba/target/${{ matrix.target }}/release/yubaba" "$STAGE/"
          cp "oss/kamaji/target/${{ matrix.target }}/release/kamaji" "$STAGE/"
          # systemd unit files for the sibling-supervisor ship path (W154).
          cp app/yah/cli/resources/yubaba.service "$STAGE/"
          cp app/yah/cli/resources/kamaji.service "$STAGE/"
          cp app/yah/cli/resources/yubaba.slice "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -la "$STAGE.tar.gz"
          # Flat dir of just the two binaries for the image job's artifact —
          # they come from different target dirs, so stage them together to keep
          # the uploaded artifact flat (yubaba + kamaji at the root).
          mkdir -p bins
          cp "oss/yubaba/target/${{ matrix.target }}/release/yubaba" bins/
          cp "oss/kamaji/target/${{ matrix.target }}/release/kamaji" bins/

      # Tarball artifact for publish-yubaba (sign-blob + R2 cp + GH Release).
      - name: Upload yubaba tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yubaba-tarball-${{ matrix.target }}
          path: yubaba-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      # Raw binaries for image-yah-yubaba's container COPY.
      - name: Upload yubaba binaries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yubaba-bins-${{ matrix.target }}
          # The Package archive step staged both binaries into ./bins so the
          # artifact stays flat (yubaba + kamaji at the root) — image-yah-yubaba's
          # `chmod ctx/<arch>/<bin>` depends on that.
          path: |
            bins/yubaba
            bins/kamaji
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # image-yah-yubaba (multi-arch, build only)
  #
  # Layers yubaba-build's binaries onto debian:bookworm-slim. Pushes only
  # :smoke-<sha>; publish-image-yubaba aliases + signs.
  # ---------------------------------------------------------------------------
  image-yah-yubaba:
    name: image / yah-yubaba (build)
    needs: [yubaba-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download yubaba binaries (amd64)
        uses: actions/download-artifact@v4
        with:
          name: yubaba-bins-x86_64-unknown-linux-musl
          path: ctx/amd64

      - name: Download yubaba binaries (arm64)
        uses: actions/download-artifact@v4
        with:
          name: yubaba-bins-aarch64-unknown-linux-musl
          path: ctx/arm64

      - name: Assemble build context
        shell: bash
        run: |
          set -euo pipefail
          cp oss/qed/crates/qed/images/yah-yubaba/Dockerfile ctx/
          cp oss/qed/crates/qed/images/yah-yubaba/pond-supervise.sh ctx/
          chmod +x ctx/amd64/yubaba ctx/amd64/kamaji
          chmod +x ctx/arm64/yubaba ctx/arm64/kamaji
          ls -la ctx/ ctx/amd64/ ctx/arm64/

      - name: Build + push yah-yubaba multi-arch (:smoke-<sha> only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ctx
          file: ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yah-ai/yah-yubaba:smoke-${{ github.sha }}
          provenance: false

  # ---------------------------------------------------------------------------
  # image-yah-miniflare (multi-arch, build only)
  # ---------------------------------------------------------------------------
  image-yah-miniflare:
    name: image / yah-miniflare (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push yah-miniflare multi-arch (:smoke-<sha> only)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: oss/qed/crates/qed/images/yah-miniflare/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yah-ai/yah-miniflare:smoke-${{ github.sha }}
          provenance: false

  # ---------------------------------------------------------------------------
  # cli-build (was cli-release)
  #
  # Cross-compiles the four CLI binaries for three linux targets. Uploads
  # tarballs as workflow artifacts only. GH Release upload moved to publish-cli.
  # The x86_64-unknown-linux-musl artifact is what smoke downloads.
  # ---------------------------------------------------------------------------
  cli-build:
    name: cli / ${{ matrix.target }} (build)
    needs: [image-yah-base, image-yah-rust, image-yah-rust-bun, image-yah-yubaba, image-yah-miniflare]
    runs-on: ${{ matrix.os }}
    env:
      YAH_BASE_DIGEST: ${{ needs.image-yah-base.outputs.digest }}
      YAH_RUST_DIGEST: ${{ needs.image-yah-rust.outputs.digest }}
      YAH_RUST_BUN_DIGEST: ${{ needs.image-yah-rust-bun.outputs.digest }}
      YAH_WARDEN_DIGEST: ${{ needs.image-yah-yubaba.outputs.digest }}
      YAH_MINIFLARE_DIGEST: ${{ needs.image-yah-miniflare.outputs.digest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: false
            use_target_flag: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            use_cross: true
            use_target_flag: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            use_cross: true
            use_target_flag: true
          # R638-F1 — darwin legs. macOS is the primary audience for a
          # `curl … | sh` one-liner, and cli-build shipped none until now, so
          # `sh -s -- yah` on a mac resolved a manifest with no entry for the
          # host triple. Neither leg uses `cross` (it publishes no
          # apple-darwin images, ever); the Apple SDK on macos-14 carries both
          # arch slices, so an arm64 runner emits x86_64-apple-darwin natively.
          # These reuse the existing "Build (native, --target)" step — until
          # now no matrix entry selected it.
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            use_cross: false
            use_target_flag: true
          - os: macos-14
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            use_cross: false
            use_target_flag: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.use_target_flag && matrix.target || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      # R638-F1 DECISION — install nasm on darwin rather than narrow the
      # feature set there. `--features all-image` pulls mozjpeg-encode, whose
      # build script shells out to nasm for the x86 SIMD kernels; the plain
      # `cargo build -p yah --locked` at DEFAULT features that mesofact-build
      # runs on macOS needs none, so narrowing WAS available. It was rejected:
      # a `yah` whose codec support (avif encode / jxl decode / mozjpeg) is a
      # function of which OS the release runner used is a capability split that
      # only shows up at runtime, on the platform this whole ticket exists to
      # serve. Two `brew install nasm` steps (~15s, cached in the runner image
      # more often than not) buy identical binaries on every triple. If you are
      # re-litigating this to shave CI minutes: narrow ALL triples or none.
      - name: Install nasm (mozjpeg-encode requires nasm at build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      # R638-F1 DECISION — cli-build stays INLINE, unlike camp-build and
      # mesofact-build which delegate to `yah qed run release-build`. release-build's
      # cross-only carve-out is gone (R560-F1), so the recipe *could* serve
      # every leg here. It is not worth it for this one job: the recipe is
      # dispatched by the `yah` binary, which is the very thing this job
      # builds, so delegating means a full debug build of `yah` on every leg
      # before the release build starts — the same crate compiled twice per
      # matrix entry. mesofact-build pays that because its dispatcher and its
      # product are different crates. Revisit only if a prebuilt dispatcher is
      # available to CI without compiling it.
      - name: Build (native, no --target)
        if: matrix.use_cross != true && matrix.use_target_flag != true
        run: cargo build --release -p yah --locked --features all-image

      - name: Build (native, --target)
        if: matrix.use_cross != true && matrix.use_target_flag == true
        run: cargo build --release -p yah --locked --features all-image --target ${{ matrix.target }}

      - name: Build (musl via cross)
        if: matrix.use_cross
        # cross 0.2.5 silently degrades to a HOST `cargo` build when its
        # `cargo metadata` probe fails (e.g. it loses a race with a cold
        # crates.io index). The host build then dies in ring's build script
        # because the musl cross-gcc lives only inside cross's container, which
        # reads as a confusing toolchain bug. Warm the index so the probe
        # resolves locally, and hard-fail if cross falls back anyway rather than
        # emit (or worse, ship) a non-cross binary.
        run: |
          cargo fetch
          cross build --release -p yah --locked --features all-image --target ${{ matrix.target }} 2>&1 | tee cross-build.log
          ! grep -qF 'Falling back to' cross-build.log

      - name: Package archive
        shell: bash
        run: |
          STAGE="cli-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          if [ "${{ matrix.use_target_flag }}" = "true" ]; then
            SRC="target/${{ matrix.target }}/release"
          else
            SRC="target/release"
          fi
          for bin in yah yahh yahb yaha; do
            cp "$SRC/$bin" "$STAGE/"
          done
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -la "$STAGE.tar.gz"

      - name: Upload cli tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-tarball-${{ matrix.target }}
          path: cli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # camp-build (was camp-release)
  # ---------------------------------------------------------------------------
  camp-build:
    name: camp / ${{ matrix.target }} (build)
    needs: [image-yah-base, image-yah-rust, image-yah-rust-bun, image-yah-yubaba, image-yah-miniflare]
    runs-on: ubuntu-latest
    env:
      YAH_BASE_DIGEST: ${{ needs.image-yah-base.outputs.digest }}
      YAH_RUST_DIGEST: ${{ needs.image-yah-rust.outputs.digest }}
      YAH_RUST_BUN_DIGEST: ${{ needs.image-yah-rust-bun.outputs.digest }}
      YAH_WARDEN_DIGEST: ${{ needs.image-yah-yubaba.outputs.digest }}
      YAH_MINIFLARE_DIGEST: ${{ needs.image-yah-miniflare.outputs.digest }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: camp-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      # W155/W170 + R435-T6: the inline guarded cross-build moved into
      # .yah/qed/release-build.toml (scripts/cross-build-guarded.sh). GHA
      # stays the runner — install cross (above), build the dispatcher binary,
      # then delegate the actual cross-compile to the `release-build` recipe.
      # The job-level digest env block flows into `cross build` via the
      # inherited process env; the recipe names no digests (W155 §4). placement
      # = ci-only is satisfied here ($GITHUB_ACTIONS=true ⇒ RunnerEnv::Ci).
      - name: build yah CLI (recipe dispatcher)
        run: cargo build -p yah --locked
      - name: yah qed run release-build (yah-camp / ${{ matrix.target }})
        run: >
          ./target/debug/yah qed run release-build
          --param package=yah
          --param target=${{ matrix.target }}
          --param bin=yah-camp
          --param features=
          --param workdir=.

      - name: Package archive
        shell: bash
        run: |
          STAGE="camp-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/yah-camp" "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -la "$STAGE.tar.gz"

      - name: Upload camp tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: camp-tarball-${{ matrix.target }}
          path: camp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # mesofact-build (R560-F1)
  #
  # There was NO mesofact build in this workflow before this job: R535-T3
  # deleted the last one (`mesofact-dev-build`) along with the retired
  # yah-mesofact-dev tini image. This job is the mesofact framework's only CI
  # build, and it exists so a TSX-only tenant can install the runtime without a
  # cargo toolchain (W236 tier-1 enablement) — `install.sh` and the /releases
  # page both consume what lands here.
  #
  # TWO BINARIES, TWO CRATES, DELIBERATELY (W225 §2a). `mesofact` is the prod
  # binary (subcommands serve|proxy|publish) built from the facade at the
  # `deploy` feature preset; `mesofact-dev` is a SEPARATE binary from a separate
  # crate carrying the file watcher + dev S3 surface. Folding dev into the prod
  # binary would put `notify` + `s3s` back into the prod dependency closure and
  # re-break the §2 dev/prod boundary that W225's "DEFECT" section just fixed.
  # They ship in one tarball; they are not one binary.
  #
  # `--features deploy` is the whole point of the preset: it is the single
  # definition of what ships, shared with Dockerfile.ssr-runtime, so the
  # container and any from-source consumer cannot drift. Never hand-list the
  # feature set here.
  #
  # TARGET MATRIX — the four BLESSED rusty_v8 tiers. `deploy` → `ssr` →
  # deno_core → the `v8` crate, whose build.rs *downloads* a prebuilt
  # librusty_v8.a rather than compiling V8 (W225 §2a: "the V8 boundary is a CDN
  # link, not a compile"). Upstream deno publishes that prebuilt for exactly
  # these four triples, so all four are free. The two musl triples are NOT here
  # on purpose: no upstream musl prebuilt exists, our own is tracked by
  # R546/rusty-v8-musl, and R546-B11 records that the currently-published musl bytes do
  # not link against deno_core — so a musl leg today would silently fall back to
  # a ~1h49m from-source V8 compile per target. Add them as a sibling once
  # R546-B11/T5 are green.
  #
  # The linux legs go through `cross` so the aarch64 leg cross-compiles from an
  # x86_64 runner without hand-managing a sysroot. They do NOT do so for glibc
  # compatibility — measured 2026-07-24, cross's `:main` images are Ubuntu 24.04
  # / glibc 2.39, identical to ubuntu-latest (its `:0.2.5` images are glibc 2.23,
  # too old to run the pinned 1.97.0 toolchain, and there is nothing published in
  # between). The produced binary's real floor is GLIBC_2.39, which does not run
  # on Debian 12 / Ubuntu 22.04 / RHEL 9. That is a REAL open defect in what
  # these two legs ship — see R639, which is expected to replace the cross
  # routing with an explicit-floor toolchain rather than tune it.
  #
  # The darwin legs cannot use cross at all — it has no apple-darwin images — so
  # they run on macOS and scripts/cross-build-guarded.sh switches to
  # `cargo --target` for them.
  # ---------------------------------------------------------------------------
  mesofact-build:
    name: mesofact / ${{ matrix.target }} (build)
    runs-on: ${{ matrix.os }}
    env:
      # Bind-mounted into the cross build container (oss/mesofact/Cross.toml
      # `volumes`) so mesofact's path deps that escape its own workspace —
      # ../../../yah-base/crates/mesofact-bundle and ../../../cheers/crates/* —
      # resolve inside the container. Without it the gnu legs die with "failed
      # to find a workspace root". Same mechanism as yubaba-build's ../qed
      # mount. Harmless on the darwin legs, which never enter a container.
      YAH_REPO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: mesofact-${{ matrix.target }}
          # oss/mesofact is its own Cargo workspace (excluded from the yah root
          # workspace), so its target dir is oss/mesofact/target. The root
          # workspace is cached too — this job builds the `yah` dispatcher there.
          workspaces: |
            .
            oss/mesofact

      - name: Install cross
        # Darwin legs build natively (see the job comment); cross is a Linux
        # container cross-compiler and is neither needed nor installable-useful
        # on the macOS runners.
        if: runner.os == 'Linux'
        run: cargo install cross --locked

      # W155/W170 + R435-T6: the guarded build idiom lives in
      # .yah/qed/release-build.toml (scripts/cross-build-guarded.sh). GHA
      # stays the runner; the recipe does the compile. placement = ci-only is
      # satisfied here ($GITHUB_ACTIONS=true ⇒ RunnerEnv::Ci).
      - name: build yah CLI (recipe dispatcher)
        run: cargo build -p yah --locked

      # Leg A — the PROD binary. features=deploy (the shipped preset), bin
      # pinned to `mesofact` so a future extra [[bin]] in the facade can't
      # silently join the release.
      - name: yah qed run release-build (mesofact / ${{ matrix.target }})
        run: >
          ./target/debug/yah qed run release-build
          --param package=mesofact
          --param target=${{ matrix.target }}
          --param bin=mesofact
          --param features=deploy
          --param workdir=oss/mesofact

      # Leg B — the DEV binary, from its own crate. Default features (= ssr);
      # it must NOT be built with `deploy`, which is the prod facade's preset.
      - name: yah qed run release-build (mesofact-dev / ${{ matrix.target }})
        run: >
          ./target/debug/yah qed run release-build
          --param package=mesofact-dev
          --param target=${{ matrix.target }}
          --param bin=mesofact-dev
          --param features=
          --param workdir=oss/mesofact

      # W225 §2 boundary, enforced in CI rather than asserted in a doc. The
      # prod binary's dependency closure must contain zero dev affordances; if
      # someone re-merges the crates or adds a stray dep, this fails the release
      # instead of shipping a prod binary with a file watcher in it.
      - name: Assert prod closure carries no dev affordances (W225 §2)
        working-directory: oss/mesofact
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p mesofact --features deploy -e normal > deploy-tree.txt
          if grep -nE 'mesofact-dev|notify|s3s' deploy-tree.txt; then
            echo "::error::mesofact --features deploy links dev affordances (W225 §2)" >&2
            exit 1
          fi
          echo "prod closure clean: no mesofact-dev / notify / s3s"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="mesofact-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          SRC="oss/mesofact/target/${{ matrix.target }}/release"
          cp "$SRC/mesofact"     "$STAGE/"
          cp "$SRC/mesofact-dev" "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -la "$STAGE.tar.gz"

      - name: Upload mesofact tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesofact-tarball-${{ matrix.target }}
          path: mesofact-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # SMOKE GATE — runs the freshly-built `yah` binary against a live provider.
  #
  # Downloads cli-build's x86_64-unknown-linux-musl tarball, untars, runs
  # `./yah qed run provider-smoke --param provider=$PROVIDER`. Zero cargo build on the
  # critical path. Verifies the exact bytes about to ship.
  #
  # Skips on:
  #   - pre-release tags (`v1.2.3-rc1`, …) — build/pipeline validation only
  #   - workflow_dispatch with skip_smoke=true — emergency override
  #
  # Downstream publish jobs gate on `needs.smoke.result != 'failure'`, so a
  # *skipped* smoke (rc tag, opt-out) doesn't block publish, but a *failed*
  # smoke does.
  # ===========================================================================
  smoke:
    name: live-smoke / deepseek
    needs: [cli-build]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_smoke != true)
    steps:
      # Checkout brings `.yah/qed/provider-smoke.toml` (and any
      # sub-pipelines it references) onto disk so `yah qed run provider-smoke`
      # resolves the pipeline via PipelineLoader. Without this, the runner's cwd
      # has only the downloaded CLI tarball and the run errors
      # `Pipeline not found: provider-smoke` (config.rs — neither
      # `.yah/qed/P*-provider-smoke.toml` nor
      # `.github/workflows/provider-smoke.yml` is present). Renamed from `smoke`
      # in R707: four other camp pipelines are also smokes, and this one tests
      # agent-provider liveness specifically. On QED, this step is a no-op via the checkout override
      # (camp root IS the workspace; we don't re-clone over a live tree).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download cli tarball (x86_64-musl)
        uses: actions/download-artifact@v4
        with:
          name: cli-tarball-x86_64-unknown-linux-musl
          path: .

      - name: Extract and run smoke pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          STAGE="cli-${{ github.ref_name }}-x86_64-unknown-linux-musl"
          tar -xzf "${STAGE}.tar.gz"
          # Provider priority: deepseek (good cache) → openrouter → groq → openai.
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            PROVIDER=deepseek
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            PROVIDER=openrouter
          elif [ -n "${GROQ_API_KEY:-}" ]; then
            PROVIDER=groq
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            PROVIDER=openai
          else
            echo "::error::No API keys found: DEEPSEEK_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY, or OPENAI_API_KEY"
            exit 1
          fi
          echo "→ Running smoke pipeline via built yah binary (provider: $PROVIDER)"
          "./${STAGE}/yah" qed run provider-smoke --param provider=$PROVIDER

  # ===========================================================================
  # PUBLISH LAYER — all irreversible side-effects gated on smoke.
  #
  # `if: always() && needs.smoke.result != 'failure' && needs.smoke.result != 'cancelled'`
  # so skipped smoke (rc tag / skip_smoke=true) still publishes; failed/cancelled
  # smoke blocks every publish job.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # publish-image-* — alias :smoke-<sha> to :latest + :<tag>, then cosign sign.
  #
  # `docker buildx imagetools create` is a registry-side manifest alias — no
  # rebuild, no re-push of bytes; the canonical tags point at the exact digest
  # smoke verified. cosign sign then targets that same digest with keyless OIDC.
  # ---------------------------------------------------------------------------
  publish-image-base:
    name: image / yah-base (publish)
    needs: [smoke, image-yah-base]
    if: |
      always()
      && needs.smoke.result != 'failure'
      && needs.smoke.result != 'cancelled'
      && needs.image-yah-base.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias :smoke-<sha> → :latest + :<tag>
        env:
          DIGEST: ${{ needs.image-yah-base.outputs.digest }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/yah-ai/yah-base:latest" \
            -t "ghcr.io/yah-ai/yah-base:${TAG}" \
            "ghcr.io/yah-ai/yah-base@${DIGEST}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign yah-base (keyless OIDC)
        env:
          DIGEST: ${{ needs.image-yah-base.outputs.digest }}
        run: cosign sign --yes "ghcr.io/yah-ai/yah-base@${DIGEST}"

  publish-image-rust:
    name: image / yah-rust (publish)
