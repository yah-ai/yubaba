[package]
name = "yubaba"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-machine infrastructure daemon for yah-managed mirrors: HTTP control surface, openraft cluster coordination, pond deploy/state reconciliation, and containerd/docker workload supervision."
keywords = ["daemon", "orchestration", "raft", "infrastructure"]
categories = ["command-line-utilities", "network-programming"]
# R743-T1: integration tests are grouped into a few binaries by feature set
# (tests/main.rs, tests/testing.rs, tests/containerd.rs, plus the standalone
# integration_smoke_filter) instead of one target per file. Each yubaba test
# binary statically links the whole dependency closure at ~730 MB of debug
# artifacts, so 22 auto-discovered targets cost ~16 GB in target/debug/deps and
# 22 link steps. autotests = false turns off per-file target discovery — which
# means a NEW tests/*.rs file is not picked up automatically: register it with a
# `mod` line in the group root matching its required features, or it silently
# never runs.
autotests = false
# R542 gate CLEARED by R635: the squatted `acme-engine` dep is now consumed as
# `passway-acme`, a name we own, so every in-house dep of this crate resolves
# from the registry. The `yubaba` name is ours (reserved at 0.0.0), so the first
# real publish is a version bump.

[[bin]]
name = "yubaba"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Enable the production containerd gRPC client. Requires a reachable containerd
# socket and pulls in tonic + containerd-client. REQUIRED in release artifacts:
# the yubaba binary is curl-fetched from a GitHub release URL (R040-F11), not
# base64-inlined in user-data, so binary size is uncapped. release.yml includes
# this feature in the yubaba-release job. Without it the daemon boots in stub
# mode and /workloads/deploy does nothing.
containerd-integration = [
    "kamaji/containerd-integration",
    "dep:containerd-client",
    "dep:prost-types",
]

# Docker CLI-backed ContainerRuntime for pond/OrbStack. No extra Rust deps —
# shells out to the `docker` binary. Enable this in the desktop/camp build
# that drives the pond yubaba-container.
docker-integration = ["kamaji/docker-integration", "kamaji-bin/docker-integration"]

# In-memory fakes for unit testing (runtime::fake, provider::fake).
# Excluded from release binaries; enable in dev-dependency test targets only.
testing = ["kamaji/testing"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
# R600-F2 (W273): decrypt raft-replicated cluster secret ciphertext with the
# node-local cluster KEK. AES-256-GCM matches the issuer's seal (R600-F3);
# already a transitive dep, promoted to direct here. `zeroize` scrubs the
# expanded AES key schedule from the cipher struct on drop.
aes-gcm = { version = "0.10", features = ["zeroize"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
# `env`: `--litestream-s3-url` also reads `YUBABA_LITESTREAM_S3_URL`, so the
# bucket a node replicates to is delivered per-node via the same
# `/etc/yah-cloud/litestream.env` that carries its credentials — rather than
# baked into the `yubaba.service` ExecStart that ships in every release tarball
# to every camp (R591-T3).
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
futures-core = "0.3"
openraft = { version = "=0.10.0-alpha.30", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# R600-F2 (W273): scrub the node-local cluster KEK from memory on drop and wipe
# the intermediate read buffer in load_cluster_kek.
zeroize = "1"
# R406-T8: typed error surface on the KamajiClient. Already a transitive
# workspace dep via kamaji-proto + reqwest; no new build cost.
thiserror = "1.0"
# R427-F1: privileged cheers client mints PASETO v4.public tokens locally
# (W159 §Service principals — Ed25519 keypair, no per-call cheers fetch).
# Same envelope cheers-server and kamaji's verifier already use.
pasetors = { version = "0.7", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# `seal` (R706/W293): the shared AES-256-GCM seal the ACME issuer writes with.
workload-spec = { package = "yah-workload-spec", version = "0.8.34", features = ["seal", "admission-verify"] }
# R600-F3 (W273): the elected ACME issuer reuses passway's extracted issuance
# engine (RFC-8555 order flow + DNS-01-via-Cloudflare, returns cert+key PEM in
# memory) instead of copy-pasting acme.rs. Version dep + [patch.crates-io]
# redirect to the sibling passway workspace, same shape as the yah-base deps.
# R635: registry name is `passway-acme`; the alias keeps `use acme_engine::…`.
acme-engine = { package = "passway-acme", version = "0.8.34" }
# R779 (W267): `cert_store` puts per-domain TLS material in R2 instead of raft —
# 10k certs would rewrite the whole KB-scale raft state on every PutSecret on
# every node (raft/store.rs:5). Same version-dep-redirected-to-path shape as the
# other yah-base deps; `crates/cloud` already consumes this crate.
yah-object-store = { version = "0.8.34" }
# R484-T2: shared Kamaji trait + runtime backend impls (containerd, docker,
# fake). Pre-W199 these lived in `yubaba::runtime::*`; now they live in
# kamaji-core and yubaba re-exports the surface through this crate.
kamaji = { version = "0.8.34", features = ["sibling"] }
# R406-T8: Yubaba ↔ Kamaji UDS wire protocol — postcard-framed messages
# shared with the kamaji binary in app/yah/kamaji/.
kamaji-proto = { version = "0.8.34" }
# Shared docker-CLI driver + S3 SigV4 helpers — yubaba owns the pond MinIO
# slot lifecycle from R374-F3 onward. cloud depends on the same crate.
local-driver = { package = "yah-local-driver", version = "0.8.34" }

# R593-T2: mshr is the machine-identity primary (promoted from xlb-net,
# R593-T1) — yubaba's hostkey loader now sources its Ed25519 keypair from
# mshr's identity-file loader instead of self-generating, so the hostkey IS
# the mshr NodeId. Path dep during development, same convention as
# oss/cheers/crates/cheers's lan-pair dep. mshr has no Cargo feature gates
# today (identity/keypair loading, the QUIC Endpoint, and discovery all
# compile together as one crate) so there is no smaller feature surface to
# opt into here — identity.rs only calls Keypair::load_or_create_at.
mshr = { path = "../../../mshr/crates/mshr", version = "0.8.34" }

# Thin pond wire-type surface (PondDeployReq/PondStateRecord/…). Carved out of
# this lib (R483-T5) so clients link the types without yubaba's server closure;
# the server side here re-exports them via `pub use warden_client::*` in pond.rs.
yubaba-client = { path = "../yubaba-client", version = "0.8.34" }

# containerd gRPC client (optional — only with containerd-integration feature)
containerd-client = { version = "0.9", optional = true }
prost-types = { version = "0.14", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
# R732-T5: the split-brain chaos test drives a real turso-backup sink over an
# in-memory object store and counts every object under it to prove a fenced
# master wrote nothing. TEST-ONLY, and that is the point (R732-T4): the WAL
# streamer is a separate kamaji-managed data-plane service, so the yubaba
# server links neither it nor turso-backup at runtime — W253 tenet 1.
object_store = "0.13"
turso-backup = { path = "../../../turso-backup", version = "0.8.34" }
yubaba-tenant-streamer = { path = "../tenant-streamer" }
futures-util = "0.3"
tower = { version = "0.5", default-features = false, features = ["util"] }
# Integration test harness — used in tests/integration_smoke_filter.rs and
# future F5/F6 integration tests.
cloud = { package = "yah-cloud", path = "../cloud", features = ["local-docker"] }
yubaba-test-macros = { path = "../yubaba-test-macros" }
yubaba-test-harness = { path = "../yubaba-test-harness" }
# R406-T8: spawn a real kamaji::serve_with_shutdown inside the
# yubaba↔kamaji integration test (tests/integration_constable_client.rs).
kamaji-bin = { version = "0.8.34" }


# ---------------------------------------------------------------------------
# R743-T1: integration-test targets, grouped by feature set.
#
# These were 22 auto-discovered per-file targets. Every yubaba test binary
# statically links the entire dependency closure (~730 MB of debug artifacts
# each), so per-file targets cost ~16 GB in target/debug/deps and 22 separate
# link steps — the dominant cost of `cargo test -p yubaba`. Grouping collapses
# that to 4 binaries with no change to the test inventory: a module path
# reproduces the old target name, so every test keeps its fully-qualified name
# (e.g. `raft_add_learner::adds_a_learner`).
#
# `autotests = false` (see [package]) disables per-file discovery. To add a
# test file, add a `mod` line to the group root matching the features it needs
# — main.rs (none), testing.rs (`testing`), containerd.rs
# (`containerd-integration`). An unregistered file compiles nowhere and runs
# never.
# ---------------------------------------------------------------------------

# No cargo features required. 16 modules; see tests/main.rs.
[[test]]
name = "main"
path = "tests/main.rs"

# FakeRuntime / fake provider tests. Covers the former
# integration_operator_bridge (headscale-mock + preauth-key creation),
# integration_ownership_smoke (R427-T2 deploy → cheers ownership write →
# destroy) and integration_service_records (R594-F6 service-record wiring +
# restart survival) targets. No real containerd, no credentials — runs in
# standard CI.
[[test]]
name = "testing"
path = "tests/testing.rs"
required-features = ["testing"]

# Real ContainerdRuntime. Covers the former integration_single_node
# (single-node local mirror E2E) and integration_mesh (raft bootstrap,
# partition recovery, quorum-loss; smoke tier uses real Hetzner machines +
# WireGuard and requires YAH_SMOKE=1) targets. Both skip gracefully when
# containerd / Colima is unavailable.
[[test]]
name = "containerd"
path = "tests/containerd.rs"
required-features = ["containerd-integration"]

# Standalone: the only file needing containerd-integration AND testing, so it
# cannot join `containerd` without forcing `testing` onto that group.
[[test]]
name = "integration_smoke_filter"
path = "tests/integration_smoke_filter.rs"
required-features = ["containerd-integration", "testing"]
