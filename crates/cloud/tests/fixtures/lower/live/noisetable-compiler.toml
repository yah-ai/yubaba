name = "noisetable-compiler"

tier = "infra"
archetype = "appliance"
replicas = 1
restart_policy = "always"

[image]
registry = "cr.yah.dev"
repository = "noisetable-compiler"
tag = "20261001b-amd64"
digest = "sha256:396f8ba0cdca1ffa23a79a956d07494877b5e361c2532762a24a3d7c984ac891"

[resources]
memory_mb = 512
cpu_millis = 2000

[[volumes]]
source = { named = { name = "noisetable-compiler-state" } }
target = "/var/lib/noisetable-compiler"
read_only = false

[annotations]
"yah.network" = "host"
"yah.placement.requires-taint" = "public-ip"
"yah.node-selector.mesh-tags" = "arch:x86,os:linux"

[expose.mesh]
identity = "noisetable-compiler"
ports = [7845, 7846, 7847]
allow_from = []

[[env]]
name = "NOISETABLE_COMPILER_LOOKUP"
value = { literal = { value = "wan" } }

[[env]]
name = "YAH_XLB_RELAY"
value = { literal = { value = "https://relay.noisetable.com" } }

[[env]]
name = "NOISETABLE_COMPILER_MAX_CONCURRENT"
value = { literal = { value = "2" } }

[healthcheck]
probe = { tcp_connect = { port = 7847 } }
interval = 15000
timeout = 5000
initial_delay = 15000
failure_threshold = 3

[stop_policy]
signal = 15
grace_period = 10000
