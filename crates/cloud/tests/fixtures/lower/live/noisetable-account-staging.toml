
name = "noisetable-account-staging"
tier = "tenant"
archetype = "appliance"
replicas = 1
restart_policy = "always"

[image]
registry = "cr.yah.dev"
repository = "noisetable-account"
tag = "20261001.1-arm64-staging-dev"
digest = "sha256:9798416035d73cb265ffabd36f306886ae4e12f3897729101a0a44cf8fd6c95a"

[resources]
memory_mb = 512
cpu_millis = 500

[annotations]
"yah.node-selector.mesh-tags" = "arch:arm,os:linux"

[[volumes]]
source = { named = { name = "noisetable-account-staging-data" } }
target = "/data"
read_only = false

[expose.mesh]
identity = "noisetable-account-staging"
ports = [4332]
allow_from = []

[expose.public]
hostname = "api-staging.noisetable.com"
port = 4332
tls = "cf_managed"

[[env]]
name = "NOISETABLE_ACCOUNT_PUBLIC_ORIGIN"
value = { literal = { value = "https://staging.noisetable.com" } }

[[env]]
name = "NOISETABLE_ACCOUNT_RP_ID"
value = { literal = { value = "staging.noisetable.com" } }

[[env]]
name = "NOISETABLE_ACCOUNT_SIGN_IN_PATH"
value = { literal = { value = "/account" } }

[[env]]
name = "NOISETABLE_ACCOUNT_MAGIC_LINK_TTL_SECS"
value = { literal = { value = "3600" } }

[[env]]
name = "NOISETABLE_ACCOUNT_MAIL_FROM"
value = { literal = { value = "Noise Table (staging) <noreply@noisetable.com>" } }

[[env]]
name = "NOISETABLE_ACCOUNT_MAILER"
value = { literal = { value = "log" } }

[[env]]
name = "NOISETABLE_ACCOUNT_ALLOWED_ORIGINS"
value = { literal = { value = "https://staging.noisetable.com" } }

[[env]]
name = "NOISETABLE_ACCOUNT_SESSION_SECRET_KEY_FILE"
value = { literal = { value = "/run/secrets/session.key" } }

[[env]]
name = "NOISETABLE_ACCOUNT_MAGIC_LINK_KEY_FILE"
value = { literal = { value = "/run/secrets/magic-link.key" } }


[[secrets]]
source = { cluster = { name = "noisetable/account-staging/session-key" } }
target = { file = { path = "/run/secrets/session.key", mode = 0o400 } }

[[secrets]]
source = { cluster = { name = "noisetable/account-staging/magic-link-key" } }
target = { file = { path = "/run/secrets/magic-link.key", mode = 0o400 } }


[healthcheck]
probe = { http_get = { path = "/__mesofact/health", port = 4332, expect_status = 200 } }
interval = 15000
timeout = 5000
initial_delay = 20000
failure_threshold = 3

[stop_policy]
signal = 15
grace_period = 10000
