name = "vm-us-west-111"
tier = "infra"
archetype = "server"
replicas = 1
restart_policy = "always"
command = ["/bin/sh", "-c", "exec sleep infinity"]

[image]
registry = "local"
repository = "kamaji-service-guest"
tag = "trixie"
digest = ""

[resources]
memory_mb = 1024
memory_request_mb = 1024
cpu_millis = 1000

[annotations]
"yah.exec" = "microvm"
"yah.node-selector.node" = "us-west-011"
"yah.resume" = "node"

[expose.mesh]
identity = "vm-us-west-111"
ports = []
allow_from = []

[stop_policy]
signal = 15
grace_period = 10000
