# W361 migration fixture (R959-T4): noisetable-seed's service.toml. Lowered with
# prod/staging it must equal ../live/noisetable-seed{,-staging}.toml
# (copied from ~/ss/noisetable/.yah/infra/workloads/, 2026-10-09).
schema_version = 1
name = "noisetable-seed"

[address]
kind = "front-door"
domain = "seed.mesh.noisetable.com"

[[components]]
id = "seed"
kind = "container"
path = "."
role = "compute"

[components.workload]
tier = "infra"
archetype = "appliance"
replicas = 1
restart_policy = "always"

[components.workload.resources]
memory_mb = 256
cpu_millis = 250

[components.workload.annotations]
"yah.network" = "host"

[components.workload.expose.mesh]
ports = [7843, 7844]
allow_from = []

[[components.workload.env]]
name = "NOISETABLE_SEED_PINS"
value = { literal = { value = "nt-samples:e154239ac61d4def5e14bf8f7d5171e6de67a922e7caa9912607206def757f17" } }

[[components.workload.env]]
name = "NOISETABLE_SEED_CACHE_BUDGET_BYTES"
value = { literal = { value = "2147483648" } }

[components.workload.healthcheck]
probe = { tcp_connect = { port = 7844 } }
interval = 15000
timeout = 5000
initial_delay = 30000
failure_threshold = 3

[components.workload.stop_policy]
signal = 15
grace_period = 10000
