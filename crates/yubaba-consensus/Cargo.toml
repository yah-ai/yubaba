[package]
name = "yubaba-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The raft core yubaba is built on: the YubabaState/YubabaRequest state machine, its openraft log store and HTTP network factory, the ClusterPolicy that shapes a cluster, and the membership ratchet that shrinks and rehydrates a voter set."
keywords = ["raft", "consensus", "cluster", "openraft"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[features]
# Expose the state machine's `apply_for_test` seam to a DEPENDENT crate's tests.
# `#[cfg(test)]` does not cross a crate boundary, and `yubaba`'s router tests
# seed applied state with it. Enabled by `yubaba` as a dev-dependency only, so no
# release build of either crate carries it.
testing = []

[dependencies]
anyhow = "1.0"
# The `OriginSource` port (noisetable R118-T11): `judge_origin` is pure and lives here, but
# READING a joiner's lineage off the joiner is I/O over routes the fleet daemon
# owns, so the fetch is a caller-supplied trait. `async-trait` rather than a
# native `async fn` in trait because the daemon calls it from an axum handler
# whose future must be `Send`, which AFIT does not promise.
async-trait = "0.1"
# R859-F2's seam crate: `YubabaStateMachine` derives the ingress owner from
# replicated member rows via `floating_ip::resolve_ingress_owner`. Its own dep
# list is anyhow + async-trait by design, so it costs a plinth nothing — and the
# derivation genuinely is a read of raft state, which is why it is here and the
# vendor HTTP adapters (`yah-floating-ip-adapters`) are not.
floating_ip = { package = "yah-floating-ip", path = "../floating-ip", version = "0.8.40" }
openraft = { version = "=0.10.0-alpha.30", features = ["serde"] }
# The raft transport itself is HTTP — `raft/network.rs` is a `RaftNetworkV2`
# over reqwest. This is not an avoidable dependency of the consensus core; it
# IS how yubaba nodes replicate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
# `TenantId`, `ResourceLimits`, `rollout::RolloutPolicy` and `secrets::SecretAccess`
# are replicated state — they are in `YubabaState`. Default features only: the
# `seal` / `admission-verify` surfaces the fleet daemon enables are issuer-side
# and never touch the state machine.
workload-spec = { package = "yah-workload-spec", version = "0.8.40" }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
